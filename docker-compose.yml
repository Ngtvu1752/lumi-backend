services:
  # ============================================
  # PostgreSQL + TimescaleDB
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: lumi-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (cache + Celery broker)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: lumi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # FastAPI Backend
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumi-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.init_hypertables &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app

  # ============================================
  # Celery Worker — Storage (INSERT into hypertables)
  # ============================================
  celery-storage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumi-celery-storage
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.worker worker --loglevel=info --queues=storage --concurrency=4
    volumes:
      - ./app:/app/app

  # ============================================
  # Celery Worker — Analytics (algorithm pipeline)
  # ============================================
  celery-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumi-celery-analytics
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.worker worker --loglevel=info --queues=analytics --concurrency=2
    volumes:
      - ./app:/app/app

volumes:
  timescaledb_data:
  redis_data:
